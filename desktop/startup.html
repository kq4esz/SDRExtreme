<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>SDR Extreme updates</title>
  <link rel="stylesheet" href="startup.css">
  <script src="startup.js" defer></script>
</head>
<body>
  <header><img src="../assets/app-icon.png" width="42" height="42" alt=""><div><strong>SDR EXTREME</strong><span id="installed-version">RECEIVER SUITE</span></div></header>
  <main aria-live="polite" aria-atomic="true">
    <h1 id="update-heading">Checking for updates…</h1>
    <p id="update-detail">Looking for the latest stable version before opening your receiver.</p>
    <progress id="update-progress" aria-label="Update progress" max="100"></progress>
  </main>
  <footer><span id="update-note">Memories and settings are preserved.</span><button id="continue-button" type="button">Open SDR Extreme now</button></footer>
</body>
</html>
